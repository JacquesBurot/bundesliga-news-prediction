[project]
name = "buli-news"
version = "0.1.0"
description = "Pipeline for collecting Bundesliga match data and pre-match news articles."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
]

[project.scripts]
buli-news = "buli_news.main:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
analysis = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
